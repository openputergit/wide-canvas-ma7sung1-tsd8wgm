<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlock Share Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --enlock-dark-blue: #1a365d;
            --enlock-light-blue: #2c5282;
        }
        .chart-container {
            height: 200px;
            position: relative;
        }
        .chart-bar {
            position: absolute;
            bottom: 0;
            width: 30px;
            background: var(--enlock-light-blue);
            transition: height 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-[#1a365d] text-white p-6">
            <div class="container mx-auto">
                <h1 class="text-2xl font-bold">Share Management</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto p-6">
            <!-- Stats Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-2">Total Active Shares</h3>
                    <p class="text-3xl font-bold text-[#2c5282]" id="totalShares">0</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-2">Most Accessed File</h3>
                    <p class="text-md text-gray-600" id="mostAccessed">-</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-2">Activity Graph</h3>
                    <div class="chart-container" id="activityChart"></div>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <div class="flex flex-wrap gap-4">
                    <select id="dateFilter" class="border rounded-md p-2">
                        <option value="">Filter by Date</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                    <select id="typeFilter" class="border rounded-md p-2">
                        <option value="">Filter by Type</option>
                        <option value="pdf">PDF</option>
                        <option value="doc">Document</option>
                        <option value="img">Image</option>
                    </select>
                    <input type="text" placeholder="Search recipients..." class="border rounded-md p-2">
                </div>
            </div>

            <!-- Shares Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">File</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Recipients</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Shared Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Expires</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Access Count</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="sharesTable">
                        <!-- Dynamic content will be inserted here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Sample data
        const shares = [
            {
                id: 1,
                fileName: "Project Proposal.pdf",
                fileType: "pdf",
                recipients: ["john@example.com", "sarah@example.com"],
                dateShared: "2023-11-01",
                expirationDate: "2023-12-01",
                accessCount: 15,
                status: "active"
            },
            {
                id: 2,
                fileName: "Meeting Notes.docx",
                fileType: "doc",
                recipients: ["team@example.com"],
                dateShared: "2023-10-28",
                expirationDate: "2023-11-28",
                accessCount: 8,
                status: "active"
            }
        ];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderShares();
            initializeActivityChart();
        });

        function updateStats() {
            document.getElementById('totalShares').textContent = shares.length;
            const mostAccessedFile = shares.reduce((prev, current) => 
                (prev.accessCount > current.accessCount) ? prev : current
            );
            document.getElementById('mostAccessed').textContent = mostAccessedFile.fileName;
        }

        function renderShares() {
            const tableBody = document.getElementById('sharesTable');
            tableBody.innerHTML = shares.map(share => `
                <tr>
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <i class="bi bi-file-${share.fileType} mr-2"></i>
                            <span>${share.fileName}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">${share.recipients.join(', ')}</td>
                    <td class="px-6 py-4">${share.dateShared}</td>
                    <td class="px-6 py-4">${share.expirationDate}</td>
                    <td class="px-6 py-4">${share.accessCount}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-sm rounded-full ${
                            share.status === 'active' ? 'bg-green-100 text-green-800' : 
                            'bg-red-100 text-red-800'
                        }">${share.status}</span>
                    </td>
                    <td class="px-6 py-4">
                        <button onclick="extendShare(${share.id})" class="text-blue-600 hover:text-blue-800 mr-2">
                            <i class="bi bi-calendar-plus"></i>
                        </button>
                        <button onclick="revokeShare(${share.id})" class="text-red-600 hover:text-red-800 mr-2">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button onclick="editPermissions(${share.id})" class="text-gray-600 hover:text-gray-800">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function initializeActivityChart() {
            const chartContainer = document.getElementById('activityChart');
            const sampleData = [10, 15, 8, 20, 12, 18, 14];
            
            chartContainer.innerHTML = sampleData.map((value, index) => `
                <div class="chart-bar" style="
                    height: ${(value/Math.max(...sampleData))*100}%;
                    left: ${(index/sampleData.length)*100}%;
                "></div>
            `).join('');
        }

        // Action functions
        function extendShare(id) {
            alert(`Extending share ${id}`);
        }

        function revokeShare(id) {
            if(confirm('Are you sure you want to revoke this share?')) {
                alert(`Revoking share ${id}`);
            }
        }

        function editPermissions(id) {
            alert(`Editing permissions for share ${id}`);
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
